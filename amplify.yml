version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "$(pwd)" > /tmp/original_dir
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm install --no-audit
    build:
      commands:
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm run build
        - cp -R dist "$(cat /tmp/original_dir)/dist"
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - "**/node_modules/**/*"
