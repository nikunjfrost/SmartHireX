version: 1
frontend:
  phases:
    preBuild:
      commands:
        - ls -la
        - pwd
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm install --no-audit
    build:
      commands:
        - if [ -d "frontend" ]; then cd frontend; fi
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
