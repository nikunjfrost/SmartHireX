version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "$(pwd)" > /tmp/original_dir
        - if [ -d "SmartHireX Website Frontend" ]; then cd "SmartHireX Website Frontend"; fi
        - rm -rf /tmp/safe_build && cp -R . /tmp/safe_build
        - cd /tmp/safe_build
        - npm install --no-audit
    build:
      commands:
        - cd /tmp/safe_build
        - npm run build
        - cp -R dist "$(cat /tmp/original_dir)/dist"
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - "/tmp/safe_build/node_modules/**/*"
