version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -d "SmartHireX Website Frontend" ]; then cd "SmartHireX Website Frontend"; fi
        - rm -rf /tmp/safe_build && cp -R . /tmp/safe_build
        - cd /tmp/safe_build
        - npm install --no-audit
    build:
      commands:
        - START_DIR="$(pwd)"
        - cd /tmp/safe_build
        - npm run build
        - cp -R dist "$START_DIR/dist"
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - "/tmp/safe_build/node_modules/**/*"
